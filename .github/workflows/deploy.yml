name: Sync & Deploy

on:
  # 改动配置 / 脚本后推送即自动部署
  push:
    branches: [v5]
  # 定时从 Google Drive 同步(每天北京时间 03:00 = UTC 19:00)
  schedule:
    - cron: "0 19 * * *"
  # 允许在 Actions 页面手动触发(想立即同步时用)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保留完整历史,Quartz 用 git 推断文章创建/修改时间

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-qzplugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: ${{ runner.os }}-qzplugins-

      - name: Install dependencies
        run: npm ci

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Pull content from Google Drive (Service Account)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_AI_FOLDER_ID: ${{ secrets.GDRIVE_AI_FOLDER_ID }}
          GDRIVE_IMAGES_FOLDER_ID: ${{ secrets.GDRIVE_IMAGES_FOLDER_ID }}
        run: |
          printf '%s' "$GDRIVE_SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "诊断:AI_FOLDER_ID 长度=${#GDRIVE_AI_FOLDER_ID}  IMAGES_FOLDER_ID 长度=${#GDRIVE_IMAGES_FOLDER_ID}"
          rclone copy ":drive,service_account_file=${RUNNER_TEMP}/sa.json,scope=drive.readonly,root_folder_id=${GDRIVE_AI_FOLDER_ID}:" "content/1 - AI" -v --stats-one-line --transfers 16
          rclone copy ":drive,service_account_file=${RUNNER_TEMP}/sa.json,scope=drive.readonly,root_folder_id=${GDRIVE_IMAGES_FOLDER_ID}:" "content/99 - images" -v --stats-one-line --transfers 16
          echo "=== 拉取后 content 下文件总数 ==="
          find content -type f | wc -l
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Adapt Obsidian content
        run: node scripts/adapt-obsidian.mjs

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build site
        run: npx quartz build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 项目不存在时自动创建(首次部署);已存在则忽略报错继续
          npx wrangler@latest pages project create ai-knowledge-base --production-branch=main || echo "项目可能已存在,继续部署"
          npx wrangler@latest pages deploy public --project-name=ai-knowledge-base --branch=main
