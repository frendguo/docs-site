name: Sync & Deploy

on:
  # 改动配置 / 脚本后推送即自动部署
  push:
    branches: [v5]
  # 定时从 Google Drive 同步(每天北京时间 03:00 = UTC 19:00)
  schedule:
    - cron: "0 19 * * *"
  # 允许在 Actions 页面手动触发(想立即同步时用)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保留完整历史,Quartz 用 git 推断文章创建/修改时间

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-qzplugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: ${{ runner.os }}-qzplugins-

      - name: Install dependencies
        run: npm ci

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Pull content from Google Drive (Service Account)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_AI_FOLDER_ID: ${{ secrets.GDRIVE_AI_FOLDER_ID }}
          GDRIVE_IMAGES_FOLDER_ID: ${{ secrets.GDRIVE_IMAGES_FOLDER_ID }}
        run: |
          printf '%s' "$GDRIVE_SA_JSON" > "$RUNNER_TEMP/sa.json"
          DRIVE=":drive,service_account_file=${RUNNER_TEMP}/sa.json,scope=drive.readonly"
          echo "=== SA 邮箱(请核对是否共享给了它)==="
          grep -o '"client_email": *"[^"]*"' "$RUNNER_TEMP/sa.json"
          echo "=== 【共享给 SA】的顶层项(shared_with_me)==="
          rclone lsd "${DRIVE},shared_with_me=true:" || true
          echo "=== root_folder_id=AI 下的子目录 ==="
          rclone lsd "${DRIVE},root_folder_id=${GDRIVE_AI_FOLDER_ID}:" || true
          echo "=== 拉取(root_folder_id 方式)==="
          rclone copy "${DRIVE},root_folder_id=${GDRIVE_AI_FOLDER_ID}:" "content/1 - AI" -v --stats-one-line --transfers 16 || true
          rclone copy "${DRIVE},root_folder_id=${GDRIVE_IMAGES_FOLDER_ID}:" "content/99 - images" -v --stats-one-line --transfers 16 || true
          echo "=== content 下文件总数 ==="
          find content -type f | wc -l
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Adapt Obsidian content
        run: node scripts/adapt-obsidian.mjs

      - name: Generate homepage (平铺全部文章到首页)
        run: node scripts/generate-home.mjs

      - name: Unignore pulled content for build
        run: |
          # Quartz build 用 globby({gitignore:true}) 扫描 content(见 quartz/util/glob.ts),
          # 会跳过 .gitignore 里 content/* 忽略的拉取内容,导致只剩 content/index.md(Found 1)。
          # 内容由 CI 从 Drive 拉取、不入库,此处仅在 runner 上临时移除 content 忽略规则,
          # 让拉取的文章/图片能被 Quartz 扫描构建。不提交,不影响仓库的 git 跟踪。
          sed -i '/content/d' .gitignore
          echo "=== 解除后 .gitignore ==="; cat .gitignore
          echo "=== 解除忽略后 Quartz 可见的 md 数 ==="; find content -name '*.md' -type f | wc -l

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build site
        run: npx quartz build

      - name: Trim search index (减小 contentIndex 全文,提速首屏)
        run: node scripts/trim-content-index.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 项目不存在时自动创建(首次部署);已存在则忽略报错继续
          npx wrangler@latest pages project create ai-knowledge-base --production-branch=main || echo "项目可能已存在,继续部署"
          npx wrangler@latest pages deploy public --project-name=ai-knowledge-base --branch=main
